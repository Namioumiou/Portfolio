<header class="bg-white top-0 z-50">
  <nav class="relative max-w-5xl mx-auto px-6 flex items-center justify-center h-16 gap-2"
       (mouseleave)="onLeave()">

    <span class="liquid-pill"
          [style.left.px]="pillLeft"
          [style.width.px]="pillWidth"
          [style.background-color]="pillColor"
          [style.opacity]="pillVisible ? 1 : 0">
    </span>

    <a routerLink="/" routerLinkActive="text-black font-semibold" [routerLinkActiveOptions]="{ exact: true }"
       class="relative z-10 px-3 md:px-6 py-2 text-sm md:text-base text-gray-600 hover:text-white rounded-full transition-colors"
       (mouseenter)="onHover($event, '#CA2E55')">Accueil</a>

    <a routerLink="/a-propos" routerLinkActive="text-black font-semibold"
       class="relative z-10 px-3 md:px-6 py-2 text-sm md:text-base text-gray-600 hover:text-white rounded-full transition-colors"
       (mouseenter)="onHover($event, '#FEE1C7')">À propos</a>

    <a routerLink="/contacter" routerLinkActive="text-black font-semibold"
       class="relative z-10 px-3 md:px-6 py-2 text-sm md:text-base text-gray-600 hover:text-white rounded-full transition-colors"
       (mouseenter)="onHover($event, '#8A6552')">Contact</a>
  </nav>
</header>
