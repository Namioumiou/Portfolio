<header class="bg-white top-0 z-50">
  <nav class="relative max-w-5xl mx-auto px-6 flex items-center justify-center h-16 gap-2"
       (mouseleave)="onLeave()">

    <span class="liquid-pill"
          [style.left.px]="pillLeft"
          [style.width.px]="pillWidth"
          [style.background-color]="pillColor"
          [style.opacity]="pillVisible ? 1 : 0">
    </span>

    <a routerLink="/" routerLinkActive="text-indigo-600 font-semibold" [routerLinkActiveOptions]="{ exact: true }"
       class="relative z-10 px-6 py-2 text-gray-600 hover:text-white rounded-full transition-colors"
       (mouseenter)="onHover($event, '#3b82f6')">Accueil</a>

    <a routerLink="/a-propos" routerLinkActive="text-indigo-600 font-semibold"
       class="relative z-10 px-6 py-2 text-gray-600 hover:text-white rounded-full transition-colors"
       (mouseenter)="onHover($event, '#8b5cf6')">À propos</a>

    <a routerLink="/contacter" routerLinkActive="text-indigo-600 font-semibold"
       class="relative z-10 px-6 py-2 text-gray-600 hover:text-white rounded-full transition-colors"
       (mouseenter)="onHover($event, '#10b981')">Contacter</a>
  </nav>
</header>
