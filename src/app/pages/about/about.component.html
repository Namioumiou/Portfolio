<main class="max-w-2xl mx-auto px-4 md:px-6 py-16 md:py-24 flex flex-col items-center gap-10">

  <div class="flex flex-col gap-4 text-center">
    <h1 class="text-3xl md:text-4xl font-bold text-gray-900">{{ lang.t().about.title }}</h1>
    <p class="text-gray-600 text-lg leading-relaxed">
      {{ lang.t().about.description }}
    </p>
  </div>

  <button
    (click)="open()"
    class="group relative w-full max-w-sm overflow-hidden rounded-2xl shadow-md hover:shadow-xl hover:scale-[1.02] transition-[transform,box-shadow] duration-150 focus:outline-none"
  >
    <img src="about/CV2026.webp" alt="CV"
      class="w-full h-auto block transition-transform duration-150 group-hover:scale-[1.04]" />
    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors duration-150 rounded-2xl"></div>
  </button>

  <a href="about/CV2026.pdf" download="AmbreRouillonCV" target="_blank"
    class="flex items-center gap-2 px-6 py-3 rounded-full bg-[#CA2E55] text-white text-sm font-semibold hover:bg-[#A82644] transition-colors duration-150">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/>
    </svg>
    {{ lang.t().about.download }}
  </a>

</main>

@if (isOpen) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4"
    (click)="close()"
    (keydown.escape)="close()"
  >
    <img
      src="about/CV2026.webp"
      alt="CV"
      class="max-h-[90vh] max-w-full rounded-xl shadow-2xl object-contain"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    />
    <button (click)="close()"
      class="absolute top-5 right-5 flex items-center justify-center w-10 h-10 rounded-full bg-white/10 hover:bg-white/25 text-white transition-colors"
      aria-label="Fermer">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
}
